                                      primary: 🗑️ Permanently Delete Batch
                                      secondary: >
                                        This removes all information about this
                                        hatch
                                      icon: mdi:delete-forever
                                      color: red
                                      tap_action:
                                        action: perform-action
                                        perform_action: pyscript.incubator_delete_edit_batch
                                        confirmation:
                                          title: Delete this batch?
                                          text: >
                                            This permanently removes the batch and
                                            all of its hatch information.
                                          confirm_text: Delete
                                          dismiss_text: Cancel
                                      card_mod:
                                        style: |
                                          ha-card {
                                            --primary-text-color: #48141c !important;
                                            --secondary-text-color: #6b2934 !important;

                                            border-radius: 22px;

                                            background:
                                              rgba(255,228,232,1) !important;

                                            border:
                                              1px solid rgba(160,45,60,0.20);
                                          }
                                    - type: custom:mushroom-template-card
                                      primary: Close
                                      icon: mdi:close
                                      color: grey
                                      tap_action:
                                        action: fire-dom-event
                                        browser_mod:
                                          service: browser_mod.close_popup
                    card_mod:
                      style: |
                        ha-card {
                          --primary-text-color: #143219 !important;
                          --secondary-text-color: #294a30 !important;

                          margin-bottom: 11px;

                          border-radius: 26px;

                          background:
                            linear-gradient(
                              145deg,
                              rgba(249,255,246,0.995),
                              rgba(215,241,210,0.99)
                            ) !important;

                          border:
                            1px solid rgba(45,100,55,0.18);

                          box-shadow:
                            0 8px 22px rgba(40,90,40,0.17);
                        }
            sort:
              method: attribute
              attribute: hatch_date
              reverse: true
            else:
              type: custom:mushroom-template-card
              primary: 📖 Our Hatch Book Is Empty
              secondary: |
                Archived hatches will appear here.
              icon: mdi:book-open-outline
              color: grey
              card_mod:
                style: |
                  ha-card {
                    --primary-text-color: #16341c !important;
                    --secondary-text-color: #2a5131 !important;

                    border-radius: 24px;

                    background:
                      rgba(240,252,237,0.99) !important;

                    box-shadow:
                      0 7px 20px rgba(35,85,45,0.15);
                  }
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: 🏷️ Quail Tag Registry
            subtitle: |
              Every tagged bird stays linked to the hatch it came from
            card_mod:
              style: |
                ha-card {
                  --primary-text-color: #17354a !important;
                  --secondary-text-color: #355b70 !important;
                  border-radius: 22px;
                  background: rgba(237,249,255,0.99) !important;
                  box-shadow: 0 7px 20px rgba(35,75,95,0.14);
                }
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.incubator_total_tags
                primary: |
                  {{ states(entity) }}
                secondary: Total Tag Records
                icon: mdi:tag-multiple
                color: blue
                vertical: true
              - type: custom:mushroom-template-card
                entity: sensor.incubator_active_tags
                primary: |
                  {{ states(entity) }}
                secondary: Active Tagged Quail
                icon: mdi:bird
                color: green
                vertical: true
              - type: custom:mushroom-template-card
                entity: sensor.incubator_untagged_chicks
                primary: |
                  {{ states(entity) }}
                secondary: Chicks Needing Tags
                icon: mdi:tag-off
                color: orange
                vertical: true
          - type: custom:auto-entities
            card:
              type: entities
              title: Tagged Quail
              show_header_toggle: false
            filter:
              include:
                - entity_id: sensor.quail_tag_*
                  options:
                    secondary_info: last-changed
              exclude: []
            sort:
              method: name
              numeric: true
            show_empty: false
      - type: grid
        cards: []
