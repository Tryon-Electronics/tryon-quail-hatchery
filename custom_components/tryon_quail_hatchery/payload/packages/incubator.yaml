    step: 1
    mode: box
    initial: 0


# ============================================================
# SELECT HELPERS
# ============================================================

input_select:

  incubator_tag_pick:
    name: Select Quail Tag
    icon: mdi:tag-search
    options:
      - "➕ Add New Tag"

  incubator_tag_color:
    name: Tag Color
    icon: mdi:palette
    options:
      - Red
      - Orange
      - Yellow
      - Green
      - Blue
      - Purple
      - Pink
      - White
      - Black
    initial: Blue

  incubator_tag_sex:
    name: Quail Sex
    icon: mdi:gender-male-female
    options:
      - Unknown
      - Male
      - Female
    initial: Unknown

  incubator_tag_status_value:
    name: Quail Status
    icon: mdi:bird
    options:
      - Active
      - Sold
      - Rehomed
      - Deceased
      - Retired
    initial: Active


# ============================================================
# BOOLEAN HELPERS
# ============================================================

input_boolean:

  incubator_edit_archived:
    name: Batch Archived
    icon: mdi:archive
    initial: false
