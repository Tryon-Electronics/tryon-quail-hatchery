views:
  - title: Incubator
    path: incubator
    icon: mdi:egg-easter
    type: sections
    max_columns: 4
    background:
      image: /local/tryon-quail-hatchery/quail-family-bg.png
      opacity: 18
      size: cover
      alignment: center
      repeat: no-repeat
      attachment: fixed
    sections:
      - type: grid
        cards:
          - type: picture
            image: /local/tryon-quail-hatchery/quail-family-bg.png
            tap_action:
              action: none
            hold_action:
              action: none
            card_mod:
              style: |
                ha-card {
                  border-radius: 30px !important;
                  overflow: hidden;

                  border:
                    2px solid rgba(112, 76, 28, 0.20);

                  box-shadow:
                    0 12px 32px rgba(54, 37, 14, 0.24);

                  animation:
                    quailHeroFloat 7s ease-in-out infinite;
                }

                @keyframes quailHeroFloat {
                  0%, 100% {
                    transform: translateY(0px);
                  }

                  50% {
                    transform: translateY(-3px);
                  }
                }
          - type: custom:mushroom-title-card
            title: 🌟 Hatchery Adventure
            subtitle: |
              Follow every little egg from incubation to fluffy chick
            card_mod:
              style: |
                ha-card {
                  --primary-text-color: #2b1c0d !important;
                  --secondary-text-color: #4a331b !important;

                  border-radius: 22px;

                  background:
                    rgba(255, 249, 229, 0.98) !important;

                  padding: 6px;

                  box-shadow:
                    0 7px 20px rgba(70,45,15,0.14);
                }
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.incubator_active_batches
                primary: |
                  {{ states(entity) }}
                secondary: 🐣 Active Batches
                icon: mdi:egg-multiple
                color: amber
                vertical: true
                tap_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      --primary-text-color: #2a1b0b !important;
                      --secondary-text-color: #493018 !important;

                      border-radius: 24px;

                      background:
                        linear-gradient(
                          145deg,
                          rgba(255,252,230,0.99),
                          rgba(255,225,145,0.99)
                        ) !important;

                      border:
                        1px solid rgba(120,80,20,0.18);

                      box-shadow:
                        0 8px 22px rgba(65,45,10,0.18);

                      animation:
                        summaryFloat1 5s ease-in-out infinite;
                    }

                    @keyframes summaryFloat1 {
                      0%, 100% {
                        transform: translateY(0);
                      }

                      50% {
                        transform: translateY(-3px);
                      }
                    }
              - type: custom:mushroom-template-card
                entity: sensor.incubator_total_eggs
                primary: |
                  {{ states(entity) }}
                secondary: 🥚 Eggs Tracked
                icon: mdi:egg
                color: orange
                vertical: true
                tap_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      --primary-text-color: #2a1b0b !important;
                      --secondary-text-color: #493018 !important;

                      border-radius: 24px;

                      background:
                        linear-gradient(
                          145deg,
                          rgba(255,249,232,0.99),
                          rgba(255,207,148,0.99)
                        ) !important;

                      border:
                        1px solid rgba(120,80,20,0.18);

                      box-shadow:
                        0 8px 22px rgba(65,45,10,0.18);

                      animation:
                        summaryFloat2 5.8s ease-in-out infinite;
                    }

                    @keyframes summaryFloat2 {
                      0%, 100% {
                        transform: translateY(0);
                      }

                      50% {
                        transform: translateY(-3px);
                      }
                    }
              - type: custom:mushroom-template-card
                entity: sensor.incubator_next_lockdown
                primary: |
                  {% set d = states(entity) %}
                  {% if d in ['unknown', 'unavailable'] %}
                    —
                  {% elif d | int(0) == 0 %}
                    TODAY!
                  {% elif d | int(0) == 1 %}
                    Tomorrow
                  {% else %}
                    {{ d }} days
                  {% endif %}
                secondary: |
                  {% set batch =
                    state_attr(
                      entity,
                      'batch_name'
                    )
                  %}
                  {% if batch %}
                    🔒 {{ batch }}
                  {% else %}
                    🔒 Next Lockdown
                  {% endif %}
                icon: mdi:lock-clock
                color: orange
                vertical: true
                tap_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      --primary-text-color: #321a0c !important;
                      --secondary-text-color: #56301c !important;

                      border-radius: 24px;

                      background:
                        linear-gradient(
                          145deg,
                          rgba(255,244,230,0.99),
                          rgba(255,190,145,0.99)
                        ) !important;

                      border:
                        1px solid rgba(145,70,20,0.20);

                      box-shadow:
                        0 8px 22px rgba(75,45,15,0.18);

                      animation:
                        lockdownGlow 3s ease-in-out infinite;
                    }

                    @keyframes lockdownGlow {
                      0%, 100% {
                        box-shadow:
                          0 8px 22px rgba(75,45,15,0.18);
                      }

                      50% {
                        box-shadow:
                          0 8px 30px rgba(235,120,35,0.42);
                      }
                    }
              - type: custom:mushroom-template-card
                entity: sensor.incubator_next_hatch
                primary: |
                  {% set d = states(entity) %}
                  {% if d in ['unknown', 'unavailable'] %}
                    —
                  {% elif d | int(0) == 0 %}
                    TODAY! 🐥
                  {% elif d | int(0) == 1 %}
                    Tomorrow
                  {% else %}
                    {{ d }} days
                  {% endif %}
                secondary: |
                  {% set batch =
                    state_attr(
                      entity,
                      'batch_name'
                    )
                  %}
                  {% if batch %}
                    🐥 {{ batch }}
                  {% else %}
                    🐥 Next Hatch
                  {% endif %}
                icon: mdi:egg-easter
                color: pink
                vertical: true
                tap_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      --primary-text-color: #361421 !important;
                      --secondary-text-color: #5c293d !important;

                      border-radius: 24px;

                      background:
                        linear-gradient(
                          145deg,
                          rgba(255,240,247,0.99),
                          rgba(255,190,218,0.99)
                        ) !important;

                      border:
                        1px solid rgba(150,65,100,0.18);

                      box-shadow:
                        0 8px 22px rgba(75,35,50,0.18);

                      animation:
                        hatchGlow 2.8s ease-in-out infinite;
                    }

                    @keyframes hatchGlow {
                      0%, 100% {
                        box-shadow:
                          0 8px 22px rgba(75,35,50,0.18);
                      }

                      50% {
                        box-shadow:
                          0 8px 31px rgba(230,90,155,0.42);
                      }
                    }
              - type: custom:mushroom-template-card
                entity: sensor.incubator_total_hatched
                primary: |
                  {{ states(entity) }}
                secondary: 🐥 Chicks Hatched
                icon: mdi:bird
                color: green
                vertical: true
                tap_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      --primary-text-color: #15351c !important;
                      --secondary-text-color: #28512f !important;

                      border-radius: 24px;

                      background:
                        linear-gradient(
                          145deg,
                          rgba(239,255,235,0.99),
                          rgba(177,237,183,0.99)
                        ) !important;

                      border:
                        1px solid rgba(50,110,60,0.18);

                      box-shadow:
                        0 8px 22px rgba(35,90,45,0.17);

                      animation:
                        summaryFloat3 6.2s ease-in-out infinite;
                    }

                    @keyframes summaryFloat3 {
                      0%, 100% {
                        transform: translateY(0);
                      }

                      50% {
                        transform: translateY(-3px);
                      }
                    }
              - type: custom:mushroom-template-card
                entity: sensor.incubator_lifetime_hatch_rate
                primary: |
                  {{ states(entity) }}%
                secondary: 🌱 Hatch Success
                icon: mdi:chart-line
                color: teal
                vertical: true
                tap_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      --primary-text-color: #103b34 !important;
                      --secondary-text-color: #275b51 !important;

                      border-radius: 24px;

                      background:
                        linear-gradient(
                          145deg,
                          rgba(232,255,250,0.99),
                          rgba(169,229,215,0.99)
                        ) !important;

                      border:
                        1px solid rgba(45,110,95,0.18);

                      box-shadow:
                        0 8px 22px rgba(35,90,75,0.17);

                      animation:
                        summaryFloat4 5.5s ease-in-out infinite;
                    }

                    @keyframes summaryFloat4 {
                      0%, 100% {
                        transform: translateY(0);
                      }

                      50% {
                        transform: translateY(-3px);
                      }
                    }
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.incubator_active_tags
                primary: |
                  {{ states(entity) }}
                secondary: 🏷️ Active Tagged Quail
                icon: mdi:tag-multiple
                color: blue
                vertical: true
                tap_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      --primary-text-color: #15324a !important;
                      --secondary-text-color: #31566f !important;
                      border-radius: 24px;
                      background: linear-gradient(145deg, rgba(236,248,255,0.99), rgba(190,225,250,0.99)) !important;
                      border: 1px solid rgba(50,100,140,0.18);
                      box-shadow: 0 8px 22px rgba(35,75,105,0.16);
                    }
              - type: custom:mushroom-template-card
                entity: sensor.incubator_untagged_chicks
                primary: |
                  {{ states(entity) }}
                secondary: 🐥 Chicks Needing Tags
                icon: mdi:tag-off
                color: orange
                vertical: true
                tap_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      --primary-text-color: #4d2d0d !important;
                      --secondary-text-color: #71451d !important;
                      border-radius: 24px;
                      background: linear-gradient(145deg, rgba(255,248,230,0.99), rgba(255,217,163,0.99)) !important;
                      border: 1px solid rgba(140,90,30,0.18);
                      box-shadow: 0 8px 22px rgba(90,60,25,0.16);
                    }
          - type: custom:mushroom-template-card
            entity: sensor.incubator_data_status
            primary: |
              {% if is_state(entity, 'error') %}
                ⚠️ Incubator Data Problem
              {% else %}
                ⚠️ Check Incubator Data
              {% endif %}
            secondary: >
              {{ state_attr(entity, 'message') or 'Check
              /config/incubator_data/batches.json' }}
            icon: mdi:database-alert
            color: red
            multiline_secondary: true
            tap_action:
              action: more-info
            visibility:
              - condition: state
                entity: sensor.incubator_data_status
                state_not: ok
            card_mod:
              style: |
                ha-card {
                  --primary-text-color: #5a1717 !important;
                  --secondary-text-color: #7b3434 !important;
                  border-radius: 24px;
                  background: rgba(255,232,232,0.98) !important;
                  border: 2px solid rgba(190,45,45,0.24);
                  box-shadow: 0 8px 24px rgba(150,40,40,0.16);
                }
          - type: custom:mushroom-template-card
            primary: 🥚 Start a New Hatch!
            secondary: |
              Add a new group of eggs to the family hatchery
            icon: mdi:egg-plus
            color: green
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: 🥚 Start a New Hatch
                  adaptive: true
                  adaptive_force_bottom_sheet: true
                  initial_style: wide
                  content:
                    type: vertical-stack
                    cards:
                      - type: custom:mushroom-template-card
                        primary: 🐣 A New Adventure Begins!
                        secondary: |
                          Add the eggs going into the incubator
                        icon: mdi:egg-plus
                        color: green
                        card_mod:
                          style: |
                            ha-card {
                              --primary-text-color: #18351d !important;
                              --secondary-text-color: #315538 !important;

                              border-radius: 24px;

                              background:
                                linear-gradient(
                                  135deg,
                                  rgba(235,255,228,1),
                                  rgba(178,239,183,1)
                                ) !important;

                              border:
                                1px solid rgba(55,115,65,0.18);
                            }
                      - type: markdown
                        content: |
                          ### 🥚 New Hatch

                          Fill in the batch information below.

                          **Start Date:** `YYYY-MM-DD`

                          Leave Start Date blank to use today's date.
                        card_mod:
                          style: |
                            ha-card {
                              --primary-text-color: #291b0d !important;

                              color: #291b0d !important;

                              border-radius: 22px;

                              background:
                                linear-gradient(
                                  135deg,
                                  rgba(255,249,225,1),
                                  rgba(255,226,167,1)
                                ) !important;
                            }
                      - type: entities
                        title: 🥚 Egg Information
                        show_header_toggle: false
                        entities:
                          - entity: input_text.incubator_batch_name
                            name: Batch Name
                            icon: mdi:tag-heart
                          - entity: input_text.incubator_species
                            name: Quail / Species
                            icon: mdi:bird
                          - entity: input_number.incubator_eggs
                            name: Eggs Set
                            icon: mdi:egg
                          - entity: input_text.incubator_start_date
                            name: Start Date
                            icon: mdi:calendar-start
                          - entity: input_number.incubator_days
                            name: Incubation Days
                            icon: mdi:calendar-range
                          - entity: input_number.incubator_candle
                            name: Candling Day
                            icon: mdi:flashlight
                          - entity: input_number.incubator_lockdown
                            name: Lockdown Day
                            icon: mdi:lock-clock
                        card_mod:
                          style: |
                            ha-card {
                              --primary-text-color: #24170a !important;
                              --secondary-text-color: #43301d !important;

                              color: #24170a !important;

                              border-radius: 22px;

                              background:
                                rgba(255,253,246,1) !important;

                              border:
                                1px solid rgba(100,70,25,0.15);
                            }
                      - type: custom:mushroom-template-card
                        entity: sensor.incubator_add_status
                        primary: |
                          {{ state_attr(
                              entity,
                              'message'
                          ) or 'Ready for a new hatch!' }}
                        icon: |
                          {{ state_attr(
                              entity,
                              'icon'
                          ) or 'mdi:egg-plus' }}
                        color: |
                          {% set status = states(entity) %}
                          {% if status == 'success' %}
                            green
                          {% elif status == 'error' %}
                            red
                          {% elif status == 'warning' %}
                            orange
                          {% else %}
                            blue
                          {% endif %}
                        card_mod:
                          style: |
                            ha-card {
                              --primary-text-color: #24170a !important;
                              --secondary-text-color: #43301d !important;

                              border-radius: 22px;

                              background:
                                rgba(255,250,237,1) !important;
                            }
                      - type: custom:mushroom-template-card
                        primary: 🐣 Create This Batch
                        secondary: |
                          Add these eggs to Quail Hatchery HQ
                        icon: mdi:egg-plus
                        color: green
                        tap_action:
                          action: perform-action
                          perform_action: pyscript.incubator_add_from_helpers
                        card_mod:
                          style: |
                            ha-card {
                              --primary-text-color: #15351c !important;
                              --secondary-text-color: #295033 !important;

                              border-radius: 22px;

                              background:
                                linear-gradient(
                                  135deg,
                                  rgba(226,255,222,1),
                                  rgba(164,235,173,1)
                                ) !important;

                              border:
                                1px solid rgba(50,120,60,0.20);
                            }
                      - type: custom:mushroom-template-card
                        primary: Close
                        icon: mdi:close
                        color: grey
                        tap_action:
                          action: fire-dom-event
                          browser_mod:
                            service: browser_mod.close_popup
            card_mod:
              style: |
                ha-card {
                  --primary-text-color: #15351c !important;
                  --secondary-text-color: #28512f !important;

                  border-radius: 26px;

                  background:
                    linear-gradient(
                      135deg,
                      rgba(229,255,223,0.99),
                      rgba(160,235,169,0.99)
                    ) !important;

                  border:
                    2px solid rgba(65,150,75,0.28);

                  box-shadow:
                    0 10px 27px rgba(45,130,60,0.22);

                  animation:
                    addBatchPulse 2.8s ease-in-out infinite;
                }

                @keyframes addBatchPulse {
                  0%, 100% {
                    transform: scale(1);
                  }

                  50% {
                    transform: scale(1.012);
                  }
                }
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: 🥚 Our Growing Eggs
            subtitle: |
              Tap any batch to view or update it
            card_mod:
              style: |
                ha-card {
                  --primary-text-color: #2a1b0b !important;
                  --secondary-text-color: #493018 !important;

                  border-radius: 22px;

                  background:
                    rgba(255,249,229,0.99) !important;

                  box-shadow:
                    0 7px 20px rgba(70,45,15,0.15);
                }
          - type: markdown
            content: >
              ### 👆 Pick a batch


              Update incubation details, record the hatch results, archive it,
              or permanently delete it.
            card_mod:
              style: |
                ha-card {
                  --primary-text-color: #281a0d !important;
                  --secondary-text-color: #49321c !important;

                  color: #281a0d !important;

                  border-radius: 22px;

                  background:
                    rgba(255,252,242,0.99) !important;

                  border:
                    1px solid rgba(100,70,25,0.14);

                  box-shadow:
                    0 6px 18px rgba(60,40,15,0.13);
                }
          - type: custom:auto-entities
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - entity_id: sensor.incubator_batch_*
                  options:
                    type: custom:mushroom-template-card
                    entity: this.entity_id
                    primary: |
                      {{ state_attr(
                          entity,
                          'friendly_name'
                      ) }}
                    secondary: >
                      🐣 {{ state_attr(entity, 'species') }} • 🥚 {{
                      state_attr(entity, 'eggs') }} eggs

                      🏷️ Tagged: {{ state_attr(entity, 'tag_count') | int(0) }}
                      • {% set need = state_attr(entity, 'untagged_chicks') |
                      int(0) %} {% if need > 0 %}{{ need }} need tag{{ '' if
                      need == 1 else 's' }}{% else %}all tagged ✅{% endif %}

                      {% set status = state_attr(entity, 'status') %}

                      {% set day = states(entity) | int(0) %}

                      {% set total = state_attr(entity, 'incubation_days') |
                      int(0) %}


                      {% if status == 'Scheduled' %}

                      📅 Starts {{ state_attr(entity, 'start_date') }}

                      {% else %}

                      📅 Day {{ day }} of {{ total }} • {{ status }}

                      {% endif %}


                      {% set p = state_attr(entity, 'progress') | int(0) %}

                      {% set blocks = (p / 10) | round(0, 'floor') | int %}

                      {% for i in range(10) %}{{ '🟡' if i < blocks else '⚪'
                      }}{% endfor %} {{ p }}%


                      {% set candle = state_attr(entity, 'days_to_candle') |
                      int(999) %}

                      {% set lockdown = state_attr(entity, 'days_to_lockdown') |
                      int(999) %}

                      {% set hatch = state_attr(entity, 'days_to_hatch') |
                      int(999) %}


                      {% if candle == 0 %}

                      🔦 CANDLING TODAY

                      {% elif candle == 1 %}

                      🔦 Candling tomorrow

                      {% endif %}


                      {% if lockdown == 0 %}

                      🔒 LOCKDOWN TODAY!

                      {% elif lockdown == 1 %}

                      🔒 Lockdown tomorrow

                      {% elif lockdown > 1 and lockdown < 999 %}

                      🔒 {{ lockdown }} days until lockdown

                      {% endif %}


                      {% if hatch == 0 %}

                      🐥 HATCH DAY TODAY!

                      {% elif hatch == 1 %}

                      🐥 Hatch expected tomorrow

                      {% elif hatch > 1 and hatch < 999 %}

                      🐥 {{ hatch }} days until hatch

                      {% endif %}


                      {% set hatched = state_attr(entity, 'hatched') | int(0) %}

                      {% set infertile = state_attr(entity, 'infertile') |
                      int(0) %}

                      {% set losses = state_attr(entity, 'losses') | int(0) %}


                      {% if status in ['Hatching', 'Complete'] or
                      state_attr(entity, 'results_recorded') %}


                      🐣 Hatched: {{ hatched }}

                      🚫 Infertile: {{ infertile }}

                      💔 Losses: {{ losses }}


                      📊 Hatch Rate: {{ state_attr(entity, 'hatch_percentage')
                      }}%


                      {% set remaining = state_attr(entity, 'unaccounted') |
                      int(0) %}


                      {% if remaining == 0 %}

                      ✅ Every egg is accounted for!

                      {% else %}

                      ❓ {{ remaining }} egg{{ '' if remaining == 1 else 's' }}
                      still unaccounted

                      {% endif %}


                      {% endif %}
                    multiline_secondary: true
                    icon: |
                      {% set status =
                        state_attr(
                          entity,
                          'status'
                        )
                      %}
                      {% if status == 'Scheduled' %}
                        mdi:calendar-clock
                      {% elif status == 'Candling' %}
                        mdi:flashlight
                      {% elif status == 'Lockdown' %}
                        mdi:lock
                      {% elif status == 'Hatching' %}
                        mdi:egg-easter
                      {% elif status == 'Complete' %}
                        mdi:bird
                      {% else %}
                        mdi:egg
                      {% endif %}
                    color: |
                      {% set status =
                        state_attr(
                          entity,
                          'status'
                        )
                      %}
                      {% if status == 'Scheduled' %}
                        grey
                      {% elif status == 'Candling' %}
                        yellow
                      {% elif status == 'Lockdown' %}
                        orange
                      {% elif status == 'Hatching' %}
                        pink
                      {% elif status == 'Complete' %}
                        green
                      {% else %}
                        blue
                      {% endif %}
                    badge_text: |
                      {{ state_attr(
                          entity,
                          'progress'
                      ) | int(0) }}%
                    badge_color: |
                      {% set status =
                        state_attr(
                          entity,
                          'status'
                        )
                      %}
                      {% if status == 'Hatching' %}
                        pink
                      {% elif status == 'Complete' %}
                        green
                      {% elif status == 'Lockdown' %}
                        orange
                      {% else %}
                        amber
                      {% endif %}
                    tap_action:
                      action: fire-dom-event
                      browser_mod:
                        service: browser_mod.sequence
                        data:
                          sequence:
                            - service: pyscript.incubator_load_batch_for_edit
                              data:
                                id: this.entity_id
                            - service: browser_mod.delay
                              data:
                                time: 300
                            - service: browser_mod.popup
                              data:
                                title: 🐥 Hatch Batch Editor
                                adaptive: true
                                adaptive_force_bottom_sheet: true
                                initial_style: wide
                                content:
                                  type: vertical-stack
                                  cards:
                                    - type: custom:mushroom-template-card
                                      primary: |
                                        🥚 {{ states(
                                            'input_text.incubator_edit_name'
                                        ) }}
                                      secondary: |
                                        {{ states(
                                            'input_text.incubator_edit_species'
                                        ) }} • Batch #{{ states(
                                            'input_text.incubator_edit_id'
                                        ) }}
                                      icon: |
                                        {% if is_state(
                                            'input_boolean.incubator_edit_archived',
                                            'on'
                                        ) %}
                                          mdi:archive
                                        {% else %}
                                          mdi:egg-easter
                                        {% endif %}
                                      color: |
                                        {% if is_state(
                                            'input_boolean.incubator_edit_archived',
                                            'on'
                                        ) %}
                                          grey
                                        {% else %}
                                          amber
                                        {% endif %}
                                      card_mod:
                                        style: |
                                          ha-card {
                                            --primary-text-color: #2a1b0b !important;
